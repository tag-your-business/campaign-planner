  lights, with simple textured gradients in the sky and walls; eye-level framing,
  medium-wide composition, balanced and inviting, with an aspirational but grounded
  festive mood.


  TEXT: "Happy Diwali" "Wishing you light, warmth, and the comfort of a home to call
  your own." "www.abchousing.com" "Civil Lines, Roorkee, Uttarakhand" "+91 1332 123456"
  "hello@abchousing.com"


