image_prompt: 'SCENE: A bright, modern dental clinic in Austin, Texas, USA, decorated
  for Valentine’s Day with subtle heart accents, a few paper garlands, and soft seasonal
  decor in the waiting area. Clean architectural lines, large windows, and a welcoming
  family-friendly atmosphere with daylight filtering in. The setting feels calm, organized,
  and approachable, with enough open space in the composition for social media text.


  SUBJECT: A friendly dentist in a clean white coat standing beside a smiling family
  with two children, all facing toward the viewer. One child holds a small heart-shaped
  card, and the family is gathered casually near a reception counter with a subtle
  Valentine’s display. The subjects are centered and clearly readable, with warm expressions
  and a caring, reassuring presence.


  DETAILS: photorealistic. Soft diffused lighting from the side mixed with warm ambient
  indoor light, echoing #E91E63 and #FFC107 as gentle atmospheric color influences
  rather than surface colors. Eye-level camera angle with a slight portrait crop for
  mobile viewing. Natural skin texture, polished clinic materials, clean countertops,
  glass, brushed metal, and soft fabric details. Mood is professional, warm, and caring,
  with a family-oriented Valentine’s Day feel and clear negative space in the lower
  frame.


  TEXT: "Happy Valentine''s Day!"

  "Sending sweet smiles to families in Austin — and a reminder to keep every smile
  healthy this season."

  "From our dental family to yours, we hope your day is full of love, laughter, and
  bright smiles."


  CONSTRAINTS: No logos, no watermarks, no company text. Primary subjects within central
  85% of frame. Reserve lower 30% for text overlay space. Keep composition uncluttered
  and high-contrast for mobile. Avoid back-of-head views. Use brand color hex codes
  #E91E63 and #FFC107 as palette hints in lighting and atmosphere only, not as surface
  colors. Ensure human subjects face toward the viewer or toward the contextual focal
  point.'
