image_prompt: 'SCENE: A premium residential tower in Sambalpur, Odisha, India, seen
  from a landscaped plaza at dusk during Diwali. The setting includes elegant apartment
  façades, warm lit balconies, subtle rangoli patterns on the ground, soft diyas along
  a walkway, and a refined festive atmosphere with faint bokeh lights in the background.
  The scene should feel aspirational, trustworthy, and welcoming for families and
  professionals looking toward a dream home.


  SUBJECT: A well-dressed Indian family and a professional couple standing together
  in the foreground, facing the viewer with relaxed smiles, holding a small decorative
  diya tray near the entrance of the tower. Behind them, the tower rises prominently
  as the visual symbol of premium living and height. The subjects should feel aspirational
  and inclusive, with polished attire and a sense of celebration tied to homeownership
  and new beginnings.


  DETAILS: photorealistic. Soft diffused evening lighting with warm highlights echoing
  #D4A373 and subtle festive glows influenced by #2E8B57, creating a premium natural-toned
  palette. Eye-level camera angle with slight upward emphasis on the tower to suggest
  prestige without distortion. Crisp textures in glass, stone, fabric, and diya flames;
  clean architectural lines, refined composition, and spacious negative space. Mood:
  luxury, aspirational, trustworthy, celebratory, and family-centered.


  TEXT: "Happy Diwali!"

  "May this Diwali light up your journey to a premium dream home, with comfort, trust,
  and a brighter tomorrow for your family."


  CONSTRAINTS: No logos, no watermarks, no company text. Primary subjects within central
  85% of frame. Reserve lower 30% for text overlay space. Keep the background uncluttered
  and mobile-friendly. Include brand color hex codes as palette hints only: #D4A373
  and #2E8B57. Do not show back-of-head views; all human subjects must face the viewer
  or the tower. Avoid excessive fireworks, clutter, or busy street scenes. Ensure
  clear negative space for the grouped header and body text.'
