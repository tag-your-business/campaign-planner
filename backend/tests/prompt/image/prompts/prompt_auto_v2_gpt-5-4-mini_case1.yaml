  polished stone, clean concrete, soft fabric clothing, brass diya reflections, fresh
  marigold petals, and subtle festive lighting. Mood: luxury, aspirational, trustworthy,
  welcoming, and family-centered.


  TEXT: "Happy Diwali!"

  "Celebrate the festival of lights in a home that reflects your aspirations, comfort,
  and future. Wishing families and professionals a brighter season of success and
  togetherness."


