  SUBJECT: A tall, modern luxury residential tower representing a dream home, with
  a small, tasteful foreground family and two professionals in festive traditional
  and semi-formal attire facing toward the viewer, smiling calmly and standing together
  as if arriving at a premium property celebration. The tower is the main anchor,
  while the people add relatability and scale. The composition should suggest Balaji
