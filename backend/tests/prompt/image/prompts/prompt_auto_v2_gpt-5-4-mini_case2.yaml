  and a calm, upscale neighborhood context. Open sky with the last traces of twilight,
  allowing strong contrast and clear negative space in the lower portion of the frame.


  SUBJECT: A family and a professionally dressed couple standing together in the foreground,
  facing the viewer with warm, welcoming expressions, positioned as the primary focus.
  They hold a small thali with lit diyas and a tasteful Diwali gift box, symbolizing
  prosperity, home, and celebration. The residential tower remains clearly visible
  behind them as the dream-home setting, with the people framed in a way that feels
  aspirational, trustworthy, and inclusive for families and professionals.


  DETAILS: Photorealistic. Luxury brand mood with refined minimalism, premium materials,
  soft diffused evening lighting from the left, and gentle warm highlights echoing
  #D4AF37 with deep twilight undertones inspired by #1A237E. Eye-level camera angle
  with slight depth, sharp focus on the subjects, realistic skin tones, textured fabric,
  polished marble, brushed metal, and glass reflections. The composition should feel
  spacious, elegant, and credible, with festive warmth balanced by modern real-estate
  sophistication.


  TEXT: "Happy Diwali!" "May this Diwali bring light, prosperity, and the joy of finding
  your perfect dream home." "Celebrate new beginnings with a premium home designed
  for families and professionals."


  CONSTRAINTS: No logos, no watermarks, no company text. Primary subjects within central
  85% of frame. Reserve lower 30% for text overlay space. Brand color hex codes as
