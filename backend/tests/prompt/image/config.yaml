# Image Generation Evaluation Configuration

# Image Model Configuration
# Reference provider(s) from framework/providers.yaml
# Single model:
# image_model: "gpt_image_2"
#
# Multiple models (tests each prompt with each model):
image_model:
  - "gpt_image_2"

# Paths
prompts_dir: "prompts"
data_path: "data/campaign_specs.json"
results_dir: "results"
images_dir: "generated_images"

# Metrics to evaluate
metrics:
  - "image_generation_success"
  - "visual_quality_score"
  - "text_placement"            # Vision judge: contact text pinned to correct edges

# Testing configuration
# When true, uses fallback image instead of API calls
use_fallback_image: false

# Optional: restrict which prompt files to evaluate.
# Each entry is a filename prefix — only files whose stem starts with a listed
# value will be included. Remove or leave empty to run all prompts.
prompt_filter:
  - "prompt_auto_v6_gpt-5-4-mini_profile_v1"
