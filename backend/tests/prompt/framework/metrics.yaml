# Metrics Registry
# Define all available metrics here, then reference by name in config.yaml files

# DeepEval Built-in Metrics
answer_relevancy:
  type: "answer_relevancy"
  name: "Answer Relevancy"
  threshold: 0.7

answer_relevancy_strict:
  type: "answer_relevancy"
  name: "Answer Relevancy (Strict)"
  threshold: 0.85

# GEval Metrics for Text Quality
coherence:
  type: "geval"
  name: "Coherence"
  criteria: "The text should be clear, fluent, and coherent"
  threshold: 0.7
  evaluation_steps:
    - "Evaluate whether the text uses clear and direct language"
    - "Check if the message is easy to understand"
    - "Assess whether the text flows naturally"
    - "Verify there are no confusing or awkward phrases"

coherence_strict:
  type: "geval"
  name: "Coherence (Strict)"
  criteria: "The text should be exceptionally clear, fluent, and coherent"
  threshold: 0.85
  evaluation_steps:
    - "Evaluate whether the text uses clear and direct language"
    - "Check if the message is easy to understand"
    - "Assess whether the text flows naturally"
    - "Verify there are no confusing or awkward phrases"

tone_matching:
  type: "geval"
  name: "Tone Matching"
  criteria: "The text should match the specified brand tone"
  threshold: 0.7
  evaluation_steps:
    - "Identify if the language aligns with the specified tone"
    - "Check if the level of formality is appropriate"
    - "Assess whether the emotional appeal matches the tone"

creativity:
  type: "geval"
  name: "Creativity"
  criteria: "The text should be creative, original, and engaging"
  threshold: 0.7
  evaluation_steps:
    - "Assess whether the text uses unique or unexpected phrasing"
    - "Check if the message stands out from generic content"
    - "Evaluate the use of creative language devices"
    - "Determine if the text would capture audience attention"

professionalism:
  type: "geval"
  name: "Professionalism"
  criteria: "The text should maintain a professional standard"
  threshold: 0.75
  evaluation_steps:
    - "Check for appropriate language and grammar"
    - "Verify absence of slang or inappropriate content"
    - "Assess overall polish and quality"
    - "Confirm the text represents the brand well"

engagement:
  type: "geval"
  name: "Engagement"
  criteria: "The text should encourage audience interaction and engagement"
  threshold: 0.7
  evaluation_steps:
    - "Check if the text includes a call-to-action"
    - "Assess whether the message invites response or interaction"
    - "Evaluate the use of questions or prompts"
    - "Determine if the text creates emotional connection"

brand_alignment:
  type: "geval"
  name: "Brand Alignment"
  criteria: "The text should align with brand values and messaging"
  threshold: 0.75
  evaluation_steps:
    - "Verify the message matches brand voice"
    - "Check if the content supports brand positioning"
    - "Assess consistency with brand values"
    - "Confirm appropriate representation of the brand"

# Caption-Specific Metrics
caption_length:
  type: "custom"
  name: "Length Validation"
  class: "tests.prompt.caption.custom_metrics.CaptionLengthMetric"
  threshold: 1.0
  params:
    min_length: 150
    max_length: 300

caption_length_short:
  type: "custom"
  name: "Length Validation (Short)"
  class: "tests.prompt.caption.custom_metrics.CaptionLengthMetric"
  threshold: 1.0
  params:
    min_length: 100
    max_length: 200

caption_length_long:
  type: "custom"
  name: "Length Validation (Long)"
  class: "tests.prompt.caption.custom_metrics.CaptionLengthMetric"
  threshold: 1.0
  params:
    min_length: 200
    max_length: 400

hashtag_count:
  type: "custom"
  name: "Hashtag Count"
  class: "tests.prompt.caption.custom_metrics.HashtagQualityMetric"
  threshold: 1.0
  params:
    min_count: 3
    max_count: 5

hashtag_count_minimal:
  type: "custom"
  name: "Hashtag Count (Minimal)"
  class: "tests.prompt.caption.custom_metrics.HashtagQualityMetric"
  threshold: 1.0
  params:
    min_count: 1
    max_count: 3

hashtag_count_extensive:
  type: "custom"
  name: "Hashtag Count (Extensive)"
  class: "tests.prompt.caption.custom_metrics.HashtagQualityMetric"
  threshold: 1.0
  params:
    min_count: 5
    max_count: 10

# Image Prompt Metrics (GEval-based)
prompt_structure:
  type: "geval"
  name: "Prompt Structure"
  criteria: "The image prompt should follow a clear 5-section structure with SCENE, SUBJECT, DETAILS, TEXT, and CONSTRAINTS sections"
  threshold: 0.8
  evaluation_steps:
    - "Check if the prompt contains a SCENE section describing environment and setting"
    - "Verify SUBJECT section exists with clear focal point description"
    - "Confirm DETAILS section includes style, lighting, and technical specs"
    - "Validate TEXT section contains quoted header and body text"
    - "Ensure CONSTRAINTS section lists restrictions and composition rules"

visual_specificity:
  type: "geval"
  name: "Visual Specificity"
  criteria: "The prompt should use concrete, specific visual descriptions without vague or generic terms"
  threshold: 0.7
  evaluation_steps:
    - "Check that descriptions use specific visual details (colors, textures, materials)"
    - "Verify absence of vague praise words (stunning, beautiful, amazing, cinematic)"
    - "Assess whether lighting and atmosphere are described concretely"
    - "Confirm visual elements are actionable for an image generation model"

brand_integration:
  type: "geval"
  name: "Brand Integration"
  criteria: "Brand colors should be integrated as tonal/atmospheric influences rather than literal surface colors"
  threshold: 0.7
  evaluation_steps:
    - "Check if brand color hex codes are mentioned in the prompt"
    - "Verify colors are used as lighting or atmospheric references"
    - "Ensure colors are not assigned as literal paint or surface colors"
    - "Assess whether brand tone translates to appropriate visual choices"

text_specification:
  type: "geval"
  name: "Text Specification"
  criteria: "The TEXT section should clearly specify header and body content with proper quoting"
  threshold: 0.8
  evaluation_steps:
    - "Verify TEXT section contains a header greeting"
    - "Check for body text that celebrates the event"
    - "Confirm text strings are wrapped in quotes"
    - "Ensure no font, color, or placement styling is specified for the header and body text"

concept_originality:
  type: "geval"
  name: "Concept Originality"
  criteria: >
    The visual concept should not be the most predictable, literal depiction of the
    event combined with the industry, while still being instantly readable as a
    celebration of the event
  threshold: 0.7
  evaluation_steps:
    - "Identify the event and industry from the input, then imagine the most obvious stock-photo scene for that pairing (e.g. a family celebrating in front of the company's product)"
    - "Check whether the prompt's SCENE and SUBJECT avoid that obvious scene"
    - "Assess whether the concept uses an unexpected perspective, scale, moment, or symbolic detail"
    - "Verify the concept is still immediately recognizable as celebrating the event — original but not obscure or abstract"

festive_not_promotional:
  type: "geval"
  name: "Festive Not Promotional"
  criteria: >
    The prompt should describe a festive greeting post, not an advertisement — the
    company's products or services must not be showcased as the subject of the image
  threshold: 0.7
  evaluation_steps:
    - "Check that the SUBJECT is a festive/celebratory focal point, not the company's product or service offering"
    - "Verify the SCENE is not staged around showcasing what the company sells (e.g. new houses for a housing firm)"
    - "Confirm there is no sales-oriented language such as offers, deals, buying, or calls to action in the rendered text"
    - "Industry context appearing as subtle scene flavor is acceptable; the industry's product as the hero of the image is not"

contact_text_placement:
  type: "geval"
  name: "Contact Text Placement"
  criteria: >
    The TEXT section should pin contact elements correctly: website and address along
    the bottom edge, phone and email in the top right corner, while header and body
    have no placement, font, or color instructions
  threshold: 0.8
  evaluation_steps:
    - "If website and/or address are provided, verify the TEXT section places them as a line along the bottom edge of the frame"
    - "If phone and/or email are provided, verify the TEXT section places them in the top right corner"
    - "Verify the header and body text have no placement, font, size, or color instructions attached"
    - "Verify the CONSTRAINTS section contains no text placement instructions — placement belongs in TEXT only"

composition_quality:
  type: "geval"
  name: "Composition Quality"
  criteria: "The prompt should describe a well-composed image suitable for social media"
  threshold: 0.7
  evaluation_steps:
    - "Check for clear focal point with 1-2 main subjects"
    - "Verify composition allows space for text overlays"
    - "Assess whether the image would work on mobile viewing"
    - "Confirm subjects are positioned within central frame area"

# Image Generation Metrics
image_generation_success:
  type: "custom"
  name: "Image Generation Success"
  class: "tests.prompt.image.custom_metrics.ImageGenerationSuccessMetric"
  threshold: 1.0

visual_quality_score:
  type: "custom"
  name: "Visual Quality Score"
  class: "tests.prompt.image.custom_metrics.VisualQualityScoreMetric"
  threshold: 0.7
  params:
    min_width: 512
    min_height: 512
    min_variance: 100.0

text_placement:
  type: "custom"
  name: "Text Placement"
  class: "tests.prompt.image.custom_metrics.TextPlacementMetric"
  threshold: 0.7
  params:
    judge_model: "gpt-4o"

# Completeness Metrics
completeness:
  type: "geval"
  name: "Completeness"
  criteria: "The output should include all required elements"
  threshold: 0.8
  evaluation_steps:
    - "Check if all key components are present"
    - "Verify no critical information is missing"
    - "Assess whether the output fully addresses the requirements"

# Accuracy Metrics
accuracy:
  type: "geval"
  name: "Accuracy"
  criteria: "The output should accurately reflect the input specifications"
  threshold: 0.75
  evaluation_steps:
    - "Verify all facts match the input"
    - "Check for any misrepresentations or errors"
    - "Confirm details are correctly incorporated"

# Conciseness Metrics
conciseness:
  type: "geval"
  name: "Conciseness"
  criteria: "The text should be concise without unnecessary verbosity"
  threshold: 0.7
  evaluation_steps:
    - "Check if the message is direct and to-the-point"
    - "Assess whether any words could be removed without losing meaning"
    - "Verify there is no repetition or redundancy"
