# Completeness Metrics
completeness:
  type: "geval"
  name: "Completeness"
  criteria: "The output should include all required elements"
  threshold: 0.8
  evaluation_steps:
    - "Check if all key components are present"
    - "Verify no critical information is missing"
    - "Assess whether the output fully addresses the requirements"

# Accuracy Metrics
accuracy:
  type: "geval"
  name: "Accuracy"
  criteria: "The output should accurately reflect the input specifications"
  threshold: 0.75
  evaluation_steps:
    - "Verify all facts match the input"
    - "Check for any misrepresentations or errors"
    - "Confirm details are correctly incorporated"

# Conciseness Metrics
conciseness:
  type: "geval"
  name: "Conciseness"
  criteria: "The text should be concise without unnecessary verbosity"
  threshold: 0.7
  evaluation_steps:
    - "Check if the message is direct and to-the-point"
    - "Assess whether any words could be removed without losing meaning"
    - "Verify there is no repetition or redundancy"
