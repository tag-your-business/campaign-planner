[project]
name = "campaign-planner"
version = "0.1.0"
description = "AI-powered campaign planner backend"
authors = [
    {name = "Abhay", email = "abhay.30121997@gmail.com"},
    {name = "Gautam", email = "gautamr347@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "openai (>=2.41.0,<3.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "tenacity (>=8.0.0,<9.0.0)",
    "pillow (>=10.0.0,<11.0.0)"
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "pytest-mock (>=3.12.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.16,<0.16.0)",
    "black (>=26.5.1,<27.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)"
]
